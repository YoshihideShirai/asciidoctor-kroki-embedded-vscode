name: CI and Release Package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Check and package VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME must match package.json version v$VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # vsce runs vscode:prepublish, which builds both bundles and copies the CSS.
      # All runtime dependencies are bundled into dist by esbuild.
      - name: Build and create VSIX package
        run: |
          mkdir -p release
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce@4.1.1 package --no-dependencies --out "release/asciidoctor-kroki-embedded-vscode-${VERSION}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-vsix
          path: release/*.vsix
          if-no-files-found: error

  release:
    name: Attach VSIX to GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension-vsix
          path: release

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.vsix
          fail_on_unmatched_files: true
